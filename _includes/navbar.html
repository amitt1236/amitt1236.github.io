<header class="site-header">
    <nav class="container nav">
        <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
        <ul class="nav-links">
            {% for item in site.data.navigation.pages %}
            <li>
                <a href="{{ item.url | relative_url }}"{% if item.name == page.navbar_title or include.active_page == item.name %} class="active" aria-current="page"{% endif %}>{{ item.name }}</a>
            </li>
            {% endfor %}
        </ul>
    </nav>
</header>
